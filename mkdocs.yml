site_name: celldform
site_description: Real-Time Machine Learning Framework for Quantitative SKBR3 Cell Deformation Analysis in Dual-Beam Optical Tweezer Systems
site_author: Isaac Oppong-Baah
repo_url: https://github.com/oppongbaah/cancer_cell_deformation
repo_name: oppongbaah/cancer_cell_deformation

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            members_order: source
            docstring_style: numpy

nav:
  - Home: index.md
  - Pipeline Overview: pipeline.md
  - Workflow Guide: workflow.md
  - Training Results: training.md
  - Data Layout: data.md
  - Scripts Reference: scripts.md
  - CLI Reference: cli.md
  - GPU & Hardware: gpu.md
  - HPC Guide: hpc.md
  - API Reference:
    - Acquisition: api/acquisition.md
    - Preprocessing: api/preprocessing.md
    - Segmentation: api/segmentation.md
    - Features: api/features.md
    - Classification: api/classification.md
    - Biomechanics: api/biomechanics.md
    - Integration: api/integration.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - attr_list
