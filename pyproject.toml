[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celldform"
version = "0.1.0"
description = "Real-time deep learning framework for quantitative cancer cell deformation analysis in dual-beam optical tweezer systems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Isaac Oppong-Baah", email = "oppongbaahisaacmega@gmail.com" }]
requires-python = ">=3.9"
keywords = ["cancer", "cell-deformation", "optical-tweezers", "deep-learning", "u-net", "segmentation", "biomedical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.0",
    "torchvision>=0.15",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "scipy>=1.11",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
hpc = ["mpi4py>=3.1"]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "black>=23.0", "ruff>=0.1"]

[project.scripts]
celldform-train-unet  = "celldform.cli:train_unet"
celldform-infer       = "celldform.cli:infer"

[project.urls]
Repository = "https://github.com/oppongbaah/celldform"

[tool.setuptools.packages.find]
where = ["."]
include = ["celldform*"]
