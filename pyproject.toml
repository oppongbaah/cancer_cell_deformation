[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celldform"
version = "0.1.0"
description = "Real-time deep learning framework for quantitative cancer cell deformation analysis in dual-beam optical tweezer systems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Isaac Oppong-Baah", email = "oppongbaahisaacmega@gmail.com" }]
requires-python = ">=3.10"   # nnunetv2 needs 3.10+
keywords = ["cancer", "cell-deformation", "optical-tweezers", "deep-learning", "u-net", "segmentation", "biomedical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.0",
    "torchvision>=0.15",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "scipy>=1.11",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "statsmodels>=0.14",   # mixed-effects deformation regression (scripts/biomechanics)
    # nnU-Net v2: the segmentation benchmark (randswap experiment_1_nnunet). Pulls its own
    # deps (batchgenerators, dynamic-network-architectures, SimpleITK, ...); it does not
    # replace torch. torch 2.9.x is excluded by nnunetv2 itself.
    "nnunetv2>=2.5",
]

[project.optional-dependencies]
hpc        = ["mpi4py>=3.1"]
api        = ["fastapi>=0.100", "uvicorn>=0.23"]
annotation = ["napari[pyqt6]>=0.4.19"]
docs       = ["mkdocs>=1.5", "mkdocs-material>=9.4", "mkdocstrings[python]>=0.24"]
dev        = ["pytest>=7.4", "pytest-cov>=4.1", "black>=23.0", "ruff>=0.1",
              "nbstripout>=0.7", "nbclient>=0.9", "nbformat>=5.9"]

[project.scripts]
# Every non-HPC script under scripts/, plus the umbrella `celldform` -- see celldform/cli.py and docs/cli.md.
celldform                       = "celldform.cli:main"
celldform-organize-dataset      = "celldform.cli:organize_dataset"
celldform-hpc-submit            = "celldform.cli:hpc_submit"
# data
celldform-extract-frames        = "celldform.cli:extract_frames"
celldform-preprocess-frames     = "celldform.cli:preprocess_frames"
celldform-build-randswap        = "celldform.cli:build_randswap"
celldform-build-nnunet-dataset  = "celldform.cli:build_nnunet_dataset"
celldform-build-distill-data    = "celldform.cli:build_distill_data"
# annotation
celldform-annotate              = "celldform.cli:annotate"
celldform-annotate-frame        = "celldform.cli:annotate_frame"
celldform-preview-masks         = "celldform.cli:preview_masks"
celldform-validate-masks        = "celldform.cli:validate_masks"
# training
celldform-train-unet            = "celldform.cli:train_unet"
celldform-train-experiment      = "celldform.cli:train_experiment"
celldform-train-cv-fold         = "celldform.cli:train_cv_fold"
celldform-train-deploy-model    = "celldform.cli:train_deploy_model"
celldform-train-nnunet-cv       = "celldform.cli:train_nnunet_cv"
celldform-train-student-cv      = "celldform.cli:train_student_cv"
celldform-distill-ensemble      = "celldform.cli:distill_ensemble"
# evaluation
celldform-evaluate-unet         = "celldform.cli:evaluate_unet"
celldform-eval-native           = "celldform.cli:eval_native"
celldform-eval-testing-set      = "celldform.cli:eval_testing_set"
celldform-eval-nnunet           = "celldform.cli:eval_nnunet"
celldform-ensemble-eval         = "celldform.cli:ensemble_eval"
celldform-eval-ensemble-cv      = "celldform.cli:eval_ensemble_cv"
celldform-summarize-cv          = "celldform.cli:summarize_cv"
celldform-compare-postswap      = "celldform.cli:compare_postswap"
celldform-check-convergence     = "celldform.cli:check_convergence"
celldform-latency-benchmark     = "celldform.cli:latency_benchmark"
# inference
celldform-infer                 = "celldform.cli:infer"
celldform-predict-single-frame  = "celldform.cli:predict_single_frame"
celldform-harvest-factory       = "celldform.cli:harvest_factory"
# report
celldform-build-report-assets   = "celldform.cli:build_report_assets"
celldform-make-report-tables    = "celldform.cli:make_report_tables"
celldform-make-cell-gif         = "celldform.cli:make_cell_gif"
celldform-diagnose-false-positives = "celldform.cli:diagnose_false_positives"
celldform-render-holdout-comparison = "celldform.cli:render_holdout_comparison"
celldform-view-soft-target      = "celldform.cli:view_soft_target"
celldform-plot-cell-sizes       = "celldform.cli:plot_cell_sizes"
celldform-plot-cv               = "celldform.cli:plot_cv"
celldform-plot-data-map         = "celldform.cli:plot_data_map"
celldform-plot-experiments      = "celldform.cli:plot_experiments"
celldform-plot-model-comparison = "celldform.cli:plot_model_comparison"
celldform-plot-nnunet-epochs    = "celldform.cli:plot_nnunet_epochs"
celldform-plot-percell-metrics  = "celldform.cli:plot_percell_metrics"
celldform-plot-pool-flow        = "celldform.cli:plot_pool_flow"
celldform-plot-resize-vs-crop   = "celldform.cli:plot_resize_vs_crop"
celldform-plot-split-change     = "celldform.cli:plot_split_change"
celldform-plot-sweep-dsc        = "celldform.cli:plot_sweep_dsc"
celldform-plot-fe-dataset       = "celldform.cli:plot_fe_dataset"
celldform-plot-features         = "celldform.cli:plot_features"
celldform-plot-final-models     = "celldform.cli:plot_final_models"
celldform-plot-high1-exclusion  = "celldform.cli:plot_high1_exclusion"
celldform-plot-high10           = "celldform.cli:plot_high10"
celldform-plot-classification-thesis = "celldform.cli:plot_classification_thesis"
celldform-plot-analysis-dataset = "celldform.cli:plot_analysis_dataset"
celldform-plot-loocv            = "celldform.cli:plot_loocv"
celldform-plot-protocols        = "celldform.cli:plot_protocols"
celldform-plot-region-selection = "celldform.cli:plot_region_selection"
celldform-diagnose-mask-growth  = "celldform.cli:diagnose_mask_growth"
celldform-extract-features      = "celldform.cli:extract_features"
celldform-benchmark-cells       = "celldform.cli:benchmark_cells"
celldform-frames-cnn            = "celldform.cli:frames_cnn"
celldform-power-resolution      = "celldform.cli:power_resolution"
celldform-tune-cells            = "celldform.cli:tune_cells"
celldform-sequence-net          = "celldform.cli:sequence_net"
celldform-feature-ranking       = "celldform.cli:feature_ranking"
celldform-combine-models        = "celldform.cli:combine_models"
celldform-deformation-regression = "celldform.cli:deformation_regression"
celldform-rate-of-deformation   = "celldform.cli:rate_of_deformation"

[project.urls]
Repository = "https://github.com/oppongbaah/cancer_cell_deformation"

[tool.setuptools.packages.find]
where = ["."]
include = ["celldform*"]
