# Experimental 3-class U-Net config — background / trapped cell / other object.
#
# Purpose: test whether explicitly annotating decoy objects (untrapped cells,
# debris, lookalike blobs) as their own class improves trapped-cell
# segmentation, versus the binary baseline in configs/default.yaml (DSC 0.72
# as of the last binary run, at 256x256). Compare class-1 (trapped_cell) DSC
# from this run's per-class evaluation against that binary DSC. Note: this
# run is at 128x128 (see preprocessing.target_size below) while the binary
# baseline was preprocessed at 256x256 — resolution is a confounding variable
# between the two, so a DSC difference could come from either the labeling
# scheme or the resolution change, not just the labeling scheme.
#
# Pre-requisites (see scripts/annotate.py --multiclass docstring):
#   1. python scripts/annotate.py --multiclass
#   2. python scripts/validate_masks.py --multiclass
#   3. python scripts/preprocess_frames.py --pool 01_annotate_pool --masks \
#        --mask-dir data/masks/01_annotate_pool_multiclass \
#        --output-dir data/preprocessed/train/01_annotate_pool_multiclass/inputs \
#        --mask-output-dir data/preprocessed/train/01_annotate_pool_multiclass/labels \
#        --target-size 128 128
#   4. celldform-train-unet --config configs/multiclass_experiment.yaml

# ─── Data paths ──────────────────────────────────────────────────────────────
data:
  frames_dir: "data/preprocessed/train/01_annotate_pool_multiclass/inputs"
  masks_dir:  "data/preprocessed/train/01_annotate_pool_multiclass/labels"
  features_csv: "data/features.csv"
  labels_csv: "data/labels.csv"
  val_split: 0.15
  test_split: 0.10

# ─── Preprocessing ───────────────────────────────────────────────────────────
# Record-of-what-was-used only — preprocess_frames.py does not read this file;
# pass --target-size to match when you run it (see prerequisites above).
preprocessing:
  target_size: [128, 128]
  median_kernel: 3
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  morph_kernel_size: 3
  enabled:
    denoise: true
    enhance: true
    morphology: true
    resize: true
    normalize: true

# ─── U-Net ───────────────────────────────────────────────────────────────────
unet:
  in_channels: 1
  base_features: 64
  out_channels: 3   # 0=background, 1=trapped cell, 2=other/decoy object

# ─── Training ────────────────────────────────────────────────────────────────
training:
  epochs: 100
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "reduce_on_plateau"
  scheduler_patience: 5
  scheduler_factor: 0.5
  num_workers: 6
  seed: 42                        # same as configs/default.yaml — keeps the train/val/test split identical
  loss_alpha: 0.3                 # CE weight in Dice+CE loss (Dice weight = 1 - alpha)
  # Chosen via a small sweep (1,1,1 / 3,3,3 / 5,5,5 / 10,10,10 / 20,20,20), each
  # trained the full 100 epochs on this 30-image set. [1,100,100] (ported blindly
  # from the binary loss_pos_weight) collapsed precision to ~0.13 by pushing
  # recall to 1.0 everywhere — CrossEntropyLoss's weighted 'mean' reduction fully
  # renormalizes by weight mass, unlike BCEWithLogitsLoss's pos_weight, so the
  # same magnitude means something much more aggressive here. [1,3,3] was the
  # sweep winner: trapped_cell P=0.695/R=0.718 (balanced, not recall-saturated).
  class_weights: [1.0, 3.0, 3.0]
  use_amp: true

# ─── Compute ─────────────────────────────────────────────────────────────────
device: null

# ─── Resume ──────────────────────────────────────────────────────────────────
resume:
  checkpoint: null
  load_optimizer: true
  load_scheduler: true

# ─── Checkpointing ───────────────────────────────────────────────────────────
checkpoint_dir: "checkpoints/multiclass_experiment"
keep_n_checkpoints: 3

# ─── Feature extraction ──────────────────────────────────────────────────────
features:
  pixel_size_um: null
  min_area_px: 50

# ─── Classification ──────────────────────────────────────────────────────────
classification:
  scale_features: true
  random_state: 42

# ─── Biomechanics ────────────────────────────────────────────────────────────
biomechanics:
  metric: "aspect_ratio"
  window_s: null
  laser_power_mW: 0.0
  trap_current_mA: 0.0

# ─── Frame extraction ────────────────────────────────────────────────────────
acquisition:
  target_fps: null
  every_n: 1
  max_frames: null
  image_format: "png"
  change_threshold: 2.0
  dark_percentile: 20.0
  channel_width: 0.30
  min_circularity: 0.60
