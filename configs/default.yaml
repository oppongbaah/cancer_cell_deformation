# Default configuration for celldform.
# All paths support environment variable expansion: $HOME, $WORK, $SCRATCH, etc.
# Override individual values via CLI flags or by passing a modified YAML.

# ─── Data paths ──────────────────────────────────────────────────────────────
data:
  frames_dir: "data/preprocessed/train/01_annotate_pool/inputs"
  masks_dir:  "data/preprocessed/train/01_annotate_pool/labels"
  features_csv: "data/features.csv"
  labels_csv: "data/labels.csv"
  val_split: 0.15    # fraction held out for validation during training
  test_split: 0.10   # fraction held out for final evaluation (never seen during training)

# ─── Preprocessing ───────────────────────────────────────────────────────────
preprocessing:
  target_size: [256, 256]
  median_kernel: 3
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  morph_kernel_size: 3
  enabled:
    denoise: true
    enhance: true
    morphology: true
    resize: true
    normalize: true

# ─── U-Net ───────────────────────────────────────────────────────────────────
unet:
  in_channels: 1
  base_features: 64

# ─── Training ────────────────────────────────────────────────────────────────
training:
  epochs: 100
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"              # "adamw" | "adam" | "sgd"
  scheduler: "reduce_on_plateau"  # "reduce_on_plateau" | "cosine" | "none"
  scheduler_patience: 5
  scheduler_factor: 0.5
  num_workers: 6                  # set to 0 on Windows; increase on HPC (Anvil)
  seed: 42
  loss_alpha: 0.3                 # BCE weight in Dice+BCE loss (Dice weight = 1 - alpha)
  loss_pos_weight: 100.0          # BCEWithLogitsLoss pos_weight; compensates ~550:1 cell/background imbalance

# ─── Compute ─────────────────────────────────────────────────────────────────
device: null    # null → auto-detect (cuda if available, else cpu)

# ─── Resume ──────────────────────────────────────────────────────────────────
resume:
  checkpoint: null       # path to .pt checkpoint to resume from; null = start fresh
  load_optimizer: true
  load_scheduler: true

# ─── Checkpointing ───────────────────────────────────────────────────────────
checkpoint_dir: "checkpoints"
keep_n_checkpoints: 3

# ─── Feature extraction ──────────────────────────────────────────────────────
features:
  pixel_size_um: null    # set to float if microscope is calibrated (e.g. 0.65 μm/px)
  min_area_px: 50

# ─── Classification ──────────────────────────────────────────────────────────
classification:
  scale_features: true
  random_state: 42

# ─── Biomechanics ────────────────────────────────────────────────────────────
biomechanics:
  metric: "aspect_ratio"   # primary deformation signal (any MorphologyExtractor column)
  window_s: null           # sliding-window width in seconds; null = disabled
  laser_power_mW: 0.0
  trap_current_mA: 0.0

# ─── Frame extraction ────────────────────────────────────────────────────────
acquisition:
  target_fps: null         # null = extract all frames; float = downsample to this rate
  every_n: 1
  max_frames: null
  image_format: "png"
  change_threshold: 2.0    # min trapped-cell centroid displacement (pixels) to save a frame;
                            # null = save every candidate frame regardless of movement
  dark_percentile: 20.0    # bottom X% of channel pixel intensities = candidate cell blobs
  channel_width: 0.30      # width of the vertical flow channel as a fraction of image width,
                            # centred at the horizontal midpoint (e.g. 0.30 = ±15% from centre)
  min_circularity: 0.60    # minimum blob circularity (4π·area/perimeter²) to be treated as a cell;
                            # 1.0 = perfect circle; reject non-circular noise with lower values
