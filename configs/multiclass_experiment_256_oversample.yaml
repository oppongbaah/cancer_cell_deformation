# Domain-oversampling A/B companion to configs/multiclass_experiment_256.yaml.
#
# Purpose: identical data, seed, and hyperparameters to multiclass_experiment_256.yaml
# (the current best checkpoint, DSC 0.943 — but that number is measured on a validation
# split that is 100% legacy-domain frames; on held-out real trapped-cell frames it drops
# to DSC 0.538 / recall 0.386 — see the "Domain gap" section in CLAUDE.md). The only
# difference here is training.domain_oversample_weight: 8.0, which uses a
# WeightedRandomSampler (see scripts/train_unet.py) to oversample domain_-prefixed
# (real-cell) train frames ~8x relative to legacy frames — shifts the real-domain share
# of each training epoch from ~12% (weight=1, i.e. off) to ~41%, without any new
# annotation. Point of this run: isolate whether that alone measurably improves
# real-cell segmentation, before committing to annotating more domain-adapt frames.
#
# To turn the effect off/on ad hoc without a separate config, use the CLI override:
#   celldform-train-unet --config configs/multiclass_experiment_256.yaml --domain-oversample-weight 8.0
#   celldform-train-unet --config configs/multiclass_experiment_256_domain_oversample.yaml --domain-oversample-weight 1.0
#
# Pre-requisites: same preprocessed data as multiclass_experiment_256.yaml already
# satisfies this config — no new preprocessing needed.
#   celldform-train-unet --config configs/multiclass_experiment_256_domain_oversample.yaml

# ─── Data paths ──────────────────────────────────────────────────────────────
data:
  frames_dir: "data/preprocessed/train/01_annotate_pool_multiclass_256/inputs"
  masks_dir:  "data/preprocessed/train/01_annotate_pool_multiclass_256/labels"
  features_csv: "data/features.csv"
  labels_csv: "data/labels.csv"
  val_split: 0.15
  test_split: 0.10

# ─── Preprocessing ───────────────────────────────────────────────────────────
# Record-of-what-was-used only — preprocess_frames.py does not read this file;
# pass --target-size to match when you run it (see prerequisites above).
preprocessing:
  target_size: [256, 256]
  median_kernel: 3
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  morph_kernel_size: 3
  enabled:
    denoise: true
    enhance: true
    morphology: true
    resize: true
    normalize: true

# ─── U-Net ───────────────────────────────────────────────────────────────────
unet:
  in_channels: 1
  base_features: 64
  out_channels: 3   # 0=background, 1=trapped cell, 2=other/decoy object

# ─── Training ────────────────────────────────────────────────────────────────
training:
  epochs: 100
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "reduce_on_plateau"
  scheduler_patience: 5
  scheduler_factor: 0.5
  num_workers: 6
  seed: 42                        # same as multiclass_experiment_256.yaml — only oversampling differs
  loss_alpha: 0.3
  class_weights: [1.0, 3.0, 3.0]
  use_amp: true
  domain_oversample_weight: 8.0   # ~12% -> ~41% real-domain frames per epoch; see header comment

# ─── Compute ─────────────────────────────────────────────────────────────────
device: null

# ─── Resume ──────────────────────────────────────────────────────────────────
resume:
  checkpoint: null
  load_optimizer: true
  load_scheduler: true

# ─── Checkpointing ───────────────────────────────────────────────────────────
checkpoint_dir: "checkpoints/multiclass_experiment_256_domain_oversample"
keep_n_checkpoints: 3

# ─── Feature extraction ──────────────────────────────────────────────────────
features:
  pixel_size_um: null
  min_area_px: 50

# ─── Classification ──────────────────────────────────────────────────────────
classification:
  scale_features: true
  random_state: 42

# ─── Biomechanics ────────────────────────────────────────────────────────────
biomechanics:
  metric: "aspect_ratio"
  window_s: null
  laser_power_mW: 0.0
  trap_current_mA: 0.0

# ─── Frame extraction ────────────────────────────────────────────────────────
acquisition:
  target_fps: null
  every_n: 1
  max_frames: null
  image_format: "png"
  change_threshold: 2.0
  dark_percentile: 20.0
  channel_width: 0.30
  min_circularity: 0.60
